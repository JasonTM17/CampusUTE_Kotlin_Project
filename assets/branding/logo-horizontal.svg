<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260">
  <!-- CampusUTE horizontal lockup (mark + wordmark). Original artwork, MIT. -->
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1173C7"/>
      <stop offset="1" stop-color="#0B5FA5"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <rect x="10" y="10" width="240" height="240" rx="56" fill="url(#hbg)"/>
  <g fill="none" stroke="#F59E0B" stroke-linecap="round">
    <path d="M 165 62 A 96 96 0 0 1 231 130" stroke-width="18" opacity="0.95"/>
    <path d="M 147 102 A 60 60 0 0 1 191 148" stroke-width="18" opacity="0.75"/>
  </g>
  <circle cx="131" cy="150" r="15" fill="#F59E0B"/>
  <g fill="#FFFFFF">
    <path d="M 130 128 L 224 170 L 130 212 L 36 170 Z"/>
    <path d="M 76 186 L 76 236 Q 130 264 184 236 L 184 186 L 130 210 Z" opacity="0.92"/>
    <rect x="212" y="170" width="11" height="62" rx="5" fill="#F59E0B"/>
    <circle cx="217" cy="240" r="12" fill="#F59E0B"/>
  </g>

  <!-- wordmark -->
  <text x="290" y="140" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="96" font-weight="700" fill="#0B5FA5">Campus<tspan fill="#F59E0B">UTE</tspan></text>
  <text x="294" y="196" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="400" fill="#6B6258">AI-Powered Smart Campus Platform</text>
</svg>
