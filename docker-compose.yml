  #
  # ai-service:
  #   build: ./ai-service
  #   container_name: campusute-ai
  #   env_file: .env
  #   ports: ["8600:8600"]
  #   depends_on:
  #     postgres: { condition: service_healthy }

volumes:
  pg_data:
  redis_data:
  minio_data:
