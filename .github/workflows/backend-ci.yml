name: backend-ci

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**"]

jobs:
  test:
    name: Testcontainers integration suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run tests (Testcontainers on Linux CI)
        working-directory: backend
        run: ./gradlew test --no-daemon
      - name: AI security gates + eval on live stack (leak / citations / injection)
        working-directory: ai-service
        run: |
          BACKEND_PORT=18080 docker compose -f ../docker-compose.yml up -d --build --wait postgres redis backend ai-service
          pip install -r requirements.txt
          RUN_STACK_TESTS=true AI_INGEST_TOKEN=dev-ingest-token \
            python -m pytest tests/ -v
      - name: Contract freeze check
        working-directory: backend
        run: ./gradlew bootJar --no-daemon
